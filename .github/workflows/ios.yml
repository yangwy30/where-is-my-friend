name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify migrations, API boundaries, encryption, and repository secrets
        run: npm run backend:test

  ios:
    name: ios build and unit tests
    # iOS 27 SwiftUI symbols require the Xcode 27 SDK at compile time.
    runs-on: xcode-27
    # Three build configurations took about 14 minutes and the unit suite about 3.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select and verify Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "iOS Simulator SDK: $SDK_VERSION"
          if [ "${SDK_VERSION%%.*}" -lt 27 ]; then
            echo "::error::This project requires Xcode 27 and the iOS 27 SDK."
            exit 1
          fi

      - name: Validate project inputs
        run: |
          plutil -lint WhereIsMyFriend/App/Info.plist
          plutil -lint WhereIsMyFriend/App/WhereIsMyFriend.entitlements
          plutil -lint WhereIsMyFriendWidget/Info.plist
          plutil -lint WhereIsMyFriendWidget/WhereIsMyFriendWidget.entitlements
          xmllint --noout 'WhereIsMyFriend.xcodeproj/xcshareddata/xcschemes/WhereIsMyFriend Staging.xcscheme'

      - name: Build Debug
        run: |
          xcodebuild \
            -project WhereIsMyFriend.xcodeproj \
            -scheme WhereIsMyFriend \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Staging
        run: |
          xcodebuild \
            -project WhereIsMyFriend.xcodeproj \
            -scheme 'WhereIsMyFriend Staging' \
            -configuration Staging \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Release
        run: |
          xcodebuild \
            -project WhereIsMyFriend.xcodeproj \
            -scheme WhereIsMyFriend \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: scripts/ci/run-ios-tests.sh unit

  ios-ui:
    name: ios UI tests (${{ matrix.shard }}/3)
    runs-on: xcode-27
    # Each shard spent ~9 minutes building and ~26 running its 32-33 tests; the rest is retry headroom.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version

      - name: Run UI test shard
        run: scripts/ci/run-ios-tests.sh ui ${{ matrix.shard }} 3
