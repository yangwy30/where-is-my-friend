<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#A6E677">
<meta name="robots" content="noindex">
<title>You’re invited to Across Us</title>
<meta name="description" content="See each other’s cities, find the dates you’ll overlap, and plan trips together.">
<meta property="og:title" content="You’re invited to Across Us">
<meta property="og:description" content="See each other’s cities, find the dates you’ll overlap, and plan trips together.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://acrossus.app/">
<meta property="og:image" content="https://acrossus.app/assets/product/social-preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/app_icon.png" type="image/png">
<link rel="preload" href="/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<style>
body{background:var(--lime);min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.invite{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-block:24px 48px}
.invite-icon{width:88px;height:88px;border-radius:22px;box-shadow:0 18px 40px -16px rgba(14,26,19,.45);margin-bottom:36px}
.invite h1{font-size:clamp(44px,7vw,80px);max-width:820px}
.invite h1 .muted{color:rgba(14,26,19,.5)}
.invite-sub{font-size:18px;line-height:1.45;max-width:420px;margin-top:24px}
.invite-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:36px}
.invite-note{font-size:14px;color:rgba(14,26,19,.6);margin-top:20px}
.emblems{display:flex;justify-content:center;margin-top:56px}
.emblems img{width:96px;height:96px;margin-inline:-8px}
.emblems img:nth-child(even){transform:translateY(-14px)}
@media(max-width:700px){
 .invite{justify-content:flex-start;padding-top:40px}
 .invite-icon{width:72px;height:72px;border-radius:18px;margin-bottom:28px}
 .invite h1{font-size:clamp(40px,11.5vw,56px)}
 .invite-sub{font-size:17px}
 .invite-actions{flex-direction:column;align-self:stretch}
 .invite-actions .pill{width:100%}
 .emblems{margin-top:44px}
 .emblems img{width:72px;height:72px;margin-inline:-6px}
}
</style>
</head>
<body>
<header class="wrap nav"><a class="wordmark" href="/" aria-label="Across Us home">across us</a></header>
<main class="wrap invite">
 <img class="invite-icon" src="/assets/app_icon.png" width="88" height="88" alt="">
 <h1 class="display"><span data-invite-name>A friend</span> <span class="muted">invited you to Across&nbsp;Us.</span></h1>
 <p class="invite-sub">See each other’s cities, find the dates you’ll overlap, and plan trips together.</p>
 <div class="invite-actions">
  <a class="pill pill-dark pill-lg" data-open-app href="whereismyfriend://">Open in Across Us</a>
  <a class="pill pill-light pill-lg" href="https://apps.apple.com/app/apple-store/id6807634842?pt=128897130&amp;ct=invite_link_202610&amp;mt=8">Get the app</a>
 </div>
 <p class="invite-note">Free on the App Store for iPhone.</p>
 <div class="emblems" aria-hidden="true"><img src="/assets/emblems/tokyo.png" alt=""><img src="/assets/emblems/paris.png" alt=""><img src="/assets/emblems/new_york.png" alt=""><img src="/assets/emblems/london.png" alt=""><img src="/assets/emblems/sydney.png" alt=""></div>
</main>
<script>
(() => {
 const match = location.pathname.match(/^\/(?:i|invite)\/([^/]+)\/?$/);
 let name = match ? match[1] : new URLSearchParams(location.search).get('u') || '';
 try { name = decodeURIComponent(name); } catch { name = ''; }
 name = name.trim().replace(/^@+/, '').toLowerCase();
 if (!/^[a-z0-9_]{3,20}$/.test(name)) return;
 document.querySelector('[data-invite-name]').textContent = '@' + name;
 document.querySelector('[data-open-app]').href = 'whereismyfriend://invite/' + name;
 document.title = '@' + name + ' invited you to Across Us';
})();
</script>
</body>
</html>
